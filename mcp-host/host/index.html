<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>사내 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"/>
<style>
:root{--bg:#F6F5FB;--card:#fff;--ink:#16142B;--mut:#8E8AAC;--pri:#3A1FC9;--line:#E7E4F5;--good:#0B6B4F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;
     display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:22px;overflow:auto}
aside h1{font-size:17px;margin:0 0 4px}
aside .sub{font-size:12px;color:var(--mut);margin-bottom:20px}
.team{font-size:11px;font-weight:800;color:var(--pri);background:#EFEAFF;
      border-radius:6px;padding:3px 8px;display:inline-block;margin:14px 0 7px}
.tool{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.tool b{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.tool span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
main{display:flex;flex-direction:column;height:100vh}
#log{flex:1;overflow:auto;padding:28px 30px}
.msg{max-width:760px;margin:0 auto 20px}
.who{font-size:11px;font-weight:800;color:var(--mut);margin-bottom:6px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:13px;
        padding:14px 16px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.msg.me .bubble{background:var(--pri);color:#fff;border-color:var(--pri)}
.call{border-left:3px solid var(--good);background:#F3FAF7;border-radius:0 9px 9px 0;
      padding:9px 12px;margin-bottom:8px;font-size:12.5px}
.call .tag{font-weight:800;color:var(--good)}
.call code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.call .ret{color:var(--mut);margin-top:3px;display:block;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
form{border-top:1px solid var(--line);background:var(--card);padding:16px 30px;display:flex;gap:10px}
input{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
      font-size:14.5px;font-family:inherit;outline:none}
input:focus{border-color:var(--pri)}
button{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:0 22px;
       font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.err{color:#B3261E}
</style>
</head>
<body>
<aside>
  <h1>사내 도우미</h1>
  <div class="sub">붙어 있는 MCP 서버</div>
  <div id="tools">불러오는 중…</div>
</aside>
<main>
  <div id="log">
    <div class="msg">
      <div class="who">도우미</div>
      <div class="bubble">붙어 있는 도구 중에 골라 답한다. 왼쪽 목록에 없는 것은 못 한다.</div>
    </div>
  </div>
  <form id="f">
    <input id="q" placeholder="3호기 불량률 알려줘" autocomplete="off"/>
    <button id="b">보내기</button>
  </form>
</main>
<script>
const log = document.getElementById('log');
const f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b');

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function bubble(who, text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.innerHTML = '<div class="who">' + esc(who) + '</div><div class="bubble">' + esc(text) + '</div>';
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d.querySelector('.bubble');
}

fetch('/tools').then(r => r.json()).then(d => {
  const box = document.getElementById('tools');
  if (!d.tools.length) { box.textContent = 'teams/ 가 비어 있다'; return; }
  const by = {};
  d.tools.forEach(t => (by[t.team] = by[t.team] || []).push(t));
  box.innerHTML = Object.keys(by).map(team =>
    '<div class="team">' + esc(team || '접두어 없음') + '</div>' +
    by[team].map(t => '<div class="tool"><b>' + esc(t.tool) + '</b><span>' +
                      esc(t.desc) + '</span></div>').join('')).join('');
});

f.onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  bubble('나', text, 'me'); q.value = ''; b.disabled = true;
  const think = bubble('도우미', '…');
  try {
    const r = await fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'},
                                    body: JSON.stringify({question: text})});
    const d = await r.json();
    if (d.error) { think.textContent = d.error; think.classList.add('err'); }
    else {
      think.textContent = d.answer;
      const wrap = think.parentElement;
      d.called.slice().reverse().forEach(c => {
        const el = document.createElement('div');
        el.className = 'call';
        el.innerHTML = '<span class="tag">' + esc(c.team) + '</span> ' +
                       '<code>' + esc(c.tool) + '(' + esc(JSON.stringify(c.args)) + ')</code>' +
                       '<span class="ret">' + esc(c.out) + '</span>';
        wrap.insertBefore(el, wrap.querySelector('.bubble'));
      });
    }
  } catch (err) { think.textContent = String(err); think.classList.add('err'); }
  b.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
};
</script>
</body>
</html>
