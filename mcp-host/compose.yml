services:
  team1:
    build: ./teams/team1
    expose: ["8000"]

  team2:
    build: ./teams/team2
    expose: ["8000"]

  host:
    build: ./host
    ports: ["8080:8080"]
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      TEAM_URLS: "http://team1:8000/mcp,http://team2:8000/mcp"
    depends_on: [team1, team2]
